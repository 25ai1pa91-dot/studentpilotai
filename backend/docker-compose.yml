version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studentpilot-backend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGO_URI=mongodb://mongo:27017/studentpilot_db
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_studentpilot_2026
      - CORS_ORIGIN=http://localhost:8443
    depends_on:
      - mongo
      - redis
    restart: always

  mongo:
    image: mongo:7.0
    container_name: studentpilot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: studentpilot-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongo_data:
