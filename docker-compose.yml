version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: studentpilot-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: studentpilot
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: studentpilot-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studentpilot-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/studentpilot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: supersecret_production_jwt_key_9876543210
      CORS_ORIGIN: http://localhost:8443
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studentpilot-frontend
    restart: always
    ports:
      - '8443:80'
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
